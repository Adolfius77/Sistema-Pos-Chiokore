spring.application.name=backend
server.port=${SERVER_PORT:8082}
server.address=0.0.0.0

# ---------- Base de datos ----------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/VentasDB?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
# show-sql inunda el log en produccion; se activa solo si hace falta depurar.
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

# ---------- Archivos subidos ----------
app.upload.dir=${APP_UPLOAD_DIR:./uploads}
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=10MB

# ---------- Seguridad ----------
# Llave con la que el POS firma y valida SUS PROPIOS tokens.
# Debe ser distinta de asistencia.api.token: si fueran la misma, cualquiera que
# conozca el token del microservicio de asistencia podria fabricarse un token de
# ADMINISTRADOR de este sistema.
# El valor de abajo es SOLO para desarrollo local: en produccion define APP_JWT_SECRET.
app.jwt.secret=${APP_JWT_SECRET:rTulBrMELlchygc8YtPd1swmkAzZl04TBy6LC3SyfPDFSVU8aKpc}
app.jwt.expiracion-ms=${APP_JWT_EXPIRACION_MS:28800000}

# Clave de acceso para administradores. Cambiala con ADMIN_CLAVE.
admin.clave=${ADMIN_CLAVE:123}

# Origenes permitidos para CORS, separados por coma. Admite comodines porque el POS
# se abre desde tablets y telefonos con IP variable en la red local.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5175,http://127.0.0.1:5173,http://127.0.0.1:5175,http://192.168.*.*:5173,http://192.168.*.*:5175}

# ---------- Microservicio de asistencia ----------
asistencia.api.url=${ASISTENCIA_API_URL:http://localhost:8080}
# Token para LLAMAR a la API de asistencia (credencial de salida, no llave de firma).
# Este valor quedo publicado en el historial de git: rotalo y define ASISTENCIA_API_TOKEN.
asistencia.api.token=${ASISTENCIA_API_TOKEN:45k34hJ0HVjoNU12ksHNTQjenTaIvsGk2KEblZKleaU}
# Intervalo de sincronizacion de usuarios (2 minutos).
asistencia.sync.intervalo-ms=${ASISTENCIA_SYNC_INTERVALO_MS:120000}
