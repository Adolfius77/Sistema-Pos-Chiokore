# Perfil de pruebas: base en memoria, sin dependencias externas.
spring.datasource.url=jdbc:h2:mem:chiokore;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

app.jwt.secret=llave-solo-para-pruebas-con-longitud-suficiente-0123456789
admin.clave=test
asistencia.api.url=http://localhost:9999
asistencia.api.token=token-de-prueba
# Sin sincronizacion automatica durante las pruebas.
asistencia.sync.intervalo-ms=3600000
