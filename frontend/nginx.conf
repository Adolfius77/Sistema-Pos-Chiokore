server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # mismos headers que el dev server de vite (client hints del dispositivo)
    add_header Accept-CH "Sec-CH-UA, Sec-CH-UA-Mobile, Sec-CH-UA-Platform, Sec-CH-UA-Platform-Version, Sec-CH-UA-Model, Sec-CH-UA-Full-Version-List" always;
    add_header Permissions-Policy "ch-ua-model=(self), ch-ua-platform-version=(self), ch-ua-full-version-list=(self)" always;

    # assets con hash: cache largo
    location /assets/ {
        add_header Accept-CH "Sec-CH-UA, Sec-CH-UA-Mobile, Sec-CH-UA-Platform, Sec-CH-UA-Platform-Version, Sec-CH-UA-Model, Sec-CH-UA-Full-Version-List" always;
        add_header Permissions-Policy "ch-ua-model=(self), ch-ua-platform-version=(self), ch-ua-full-version-list=(self)" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # fallback SPA para react-router
    location / {
        add_header Accept-CH "Sec-CH-UA, Sec-CH-UA-Mobile, Sec-CH-UA-Platform, Sec-CH-UA-Platform-Version, Sec-CH-UA-Model, Sec-CH-UA-Full-Version-List" always;
        add_header Permissions-Policy "ch-ua-model=(self), ch-ua-platform-version=(self), ch-ua-full-version-list=(self)" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
