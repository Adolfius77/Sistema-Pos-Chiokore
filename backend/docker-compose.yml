# En Docker Desktop aparece como el grupo "chiokore-pos" (pos-db, pos-backend, pos-frontend),
# separado del sistema de asistencia ("chiokore-asistencia")
name: chiokore-pos

services:
  db:
    image: mysql:8.4
    container_name: pos-db
    environment:
      MYSQL_DATABASE: VentasDB
      MYSQL_USER: ${DB_USUARIO:-usuario_pos}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en tu archivo .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Falta DB_ROOT_PASSWORD en tu archivo .env}
      TZ: ${TZ:-America/Mexico_City}
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "127.0.0.1:3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  backend:
    build: .
    image: chiokore-pos-backend:latest
    container_name: pos-backend
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://db:3306/VentasDB?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC"
      SPRING_DATASOURCE_USERNAME: ${DB_USUARIO:-usuario_pos}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      ASISTENCIA_API_URL: http://host.docker.internal:8080
      APP_UPLOAD_DIR: /app/uploads
      # Acepta el front desde cualquier IP (localhost, 192.168.x.x, 10.x.x.x...)
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://*:5175,http://*:5173}
      TZ: ${TZ:-America/Mexico_City}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - uploads:/app/uploads
    ports:
      - "8082:8082"
    restart: unless-stopped

  frontend:
    container_name: pos-frontend
    image: chiokore-pos-frontend:latest
    build:
      context: ../frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_AUTH_TOKEN_KEY: ${VITE_AUTH_TOKEN_KEY:-token_pos_chiokore}
        VITE_AUTH_ROLE_KEY: ${VITE_AUTH_ROLE_KEY:-rol_pos_chiokore}
        VITE_URL_LOGIN_EXTERNO: ${VITE_URL_LOGIN_EXTERNO:-}
        VITE_URL_LOGOUT_EXTERNO: ${VITE_URL_LOGOUT_EXTERNO:-}
    depends_on:
      - backend
    ports:
      - "5175:80"
    restart: unless-stopped

# Nombres fijos: son los volúmenes que se crearon cuando el proyecto se llamaba "chiokore",
# así se conservan la base de datos y las imágenes de productos
volumes:
  mysql-data:
    name: chiokore_mysql-data
  uploads:
    name: chiokore_uploads
