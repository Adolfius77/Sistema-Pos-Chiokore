#nombre del proyecto
spring.application.name=backend

#puerto del servidor
server.port=${SERVER_PORT:8082}
#esto hace que acepte a cualquiera
server.address=0.0.0.0

#configuracion de la base de datos
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ventasDB?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}


#configuracion de flyway para los scripts de migracion de la base de datos
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Esquema preexistente creado por Hibernate


#configuracion de la carpeta de uploads y el tamano maximo de los archivos
app.upload.dir=${APP_UPLOAD_DIR:./uploads}
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=10MB


#configuracion de JWT
app.jwt.secret=${APP_JWT_SECRET:rTulBrMELlchygc8YtPd1swmkAzZl04TBy6LC3SyfPDFSVU8aKpc}
app.jwt.expiracion-ms=${APP_JWT_EXPIRACION_MS:28800000}

#password del admin "se puede cambiar"
admin.clave=${ADMIN_CLAVE:123}

#configuracion de CORS para permitir el acceso desde el frontend
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5175,http://localhost:5175,http://127.0.0.1:5175,http://127.0.0.1:5175,http://192.168.*.*:5175,http://192.168.*.*:5175}
asistencia.api.url=${ASISTENCIA_API_URL:http://localhost:8080}
#configuracion de la API de asistencia
asistencia.api.token=${ASISTENCIA_API_TOKEN:45k34hJ0HVjoNU12ksHNTQjenTaIvsGk2KEblZKleaU}
#configuracion del intervalo de sincronizacion de la API de asistencia
asistencia.sync.intervalo-ms=${ASISTENCIA_SYNC_INTERVALO_MS:120000}

#proxies cuyos headers X-Forwarded-For / X-Real-IP se aceptan para la ip_origen de la venta
#vacio = no se leen esos headers y se usa la IP real de la conexion (correcto sin proxy delante)
#si se pone un nginx/reverse proxy delante, listar aqui su IP: APP_PROXIES_CONFIABLES=127.0.0.1
app.proxies-confiables=${APP_PROXIES_CONFIABLES:}
